<!-- SVG placeholder icon - you can convert this to PNG -->
<svg width="512" height="512" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="grad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#0d9488;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#14b8a6;stop-opacity:1" />
    </linearGradient>
  </defs>
  
  <!-- Background -->
  <rect width="512" height="512" rx="64" fill="url(#grad)"/>
  
  <!-- House Icon -->
  <g transform="translate(128, 128)" fill="white">
    <!-- Roof -->
    <path d="M 128 32 L 0 144 L 32 144 L 32 240 L 224 240 L 224 144 L 256 144 Z"/>
    <!-- Door -->
    <rect x="96" y="160" width="64" height="80" fill="#0d9488"/>
    <!-- Windows -->
    <rect x="48" y="160" width="32" height="32" fill="#0d9488"/>
    <rect x="176" y="160" width="32" height="32" fill="#0d9488"/>
  </g>
  
  <!-- RV Text -->
  <text x="256" y="400" text-anchor="middle" font-family="Arial, sans-serif" font-size="80" font-weight="bold" fill="white">RV</text>
</svg>
